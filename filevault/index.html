<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileVault</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080810;
  --surface: #10101a;
  --surf2:   #161622;
  --border:  #1e1e30;
  --bord2:   #2a2a40;
  --accent:  #7c6fff;
  --green:   #6fffd4;
  --pink:    #ff6fb0;
  --text:    #eeeaf8;
  --muted:   #6b6880;
  --danger:  #ff5f6d;
  --r:       12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
}

body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 50% at 75% 5%, rgba(124,111,255,.08), transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 90%, rgba(255,111,176,.06), transparent 60%);
}

#auth, #app { position: relative; z-index: 1; }

#auth {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}

#app { display: none; flex-direction: column; min-height: 100vh; }

.box {
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px;
  box-shadow: 0 0 40px rgba(124,111,255,.12);
  animation: up .5s cubic-bezier(.22,1,.36,1);
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 2rem; font-weight: 700;
  background: linear-gradient(135deg, var(--text) 40%, var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 4px;
}

.sub { color: var(--muted); font-size: .75rem; margin-bottom: 28px; }

.tabs {
  display: flex; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 3px; margin-bottom: 24px;
}

.tab {
  flex: 1; padding: 8px; border-radius: 6px; border: none;
  background: transparent; color: var(--muted);
  font-family: 'JetBrains Mono', monospace; font-size: .75rem;
  cursor: pointer; transition: background .2s, color .2s;
}

.tab.on { background: var(--surf2); color: var(--text); }

label { display: block; font-size: .68rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }

input[type=email], input[type=password], input[type=text] {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  padding: 12px 14px; outline: none; margin-bottom: 16px;
  transition: border-color .2s;
}

input:focus { border-color: var(--accent); }

.btn {
  width: 100%; padding: 13px; border-radius: var(--r); border: none;
  font-family: 'JetBrains Mono', monospace; font-size: .82rem; font-weight: 500;
  cursor: pointer; letter-spacing: .03em;
  transition: transform .15s, opacity .15s;
}

.btn:hover { transform: translateY(-1px); }
.btn:active { transform: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #9b8dff);
  color: #fff; box-shadow: 0 4px 16px rgba(124,111,255,.3);
  margin-bottom: 14px;
}

.or {
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font-size: .7rem; text-transform: uppercase;
  margin-bottom: 14px;
}
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.btn-google {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surf2); border: 1px solid var(--bord2);
  color: var(--text); transition: border-color .2s, transform .15s;
}
.btn-google:hover { border-color: var(--green); }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 32px; border-bottom: 1px solid var(--border);
  background: rgba(8,8,16,.85); backdrop-filter: blur(14px);
  position: sticky; top: 0; z-index: 10;
}

.hlogo { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--accent); }

.hright { display: flex; align-items: center; gap: 12px; }

#user-email { font-size: .72rem; color: var(--muted); }

.btn-out {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 8px; padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: .72rem;
  cursor: pointer; transition: border-color .2s, color .2s;
}
.btn-out:hover { border-color: var(--danger); color: var(--danger); }

main { padding: 36px 32px; max-width: 860px; margin: 0 auto; width: 100%; }

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; margin-bottom: 36px;
}

.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px 18px;
}

.stat-l { font-size: .67rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.stat-v { font-family: 'Playfair Display', serif; font-size: 1.5rem; }
.stat-v span { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--muted); margin-left: 3px; }

.zone {
  border: 1.5px dashed var(--bord2); border-radius: 16px; padding: 44px;
  text-align: center; cursor: pointer; margin-bottom: 36px;
  transition: border-color .2s, background .2s;
  background: rgba(124,111,255,.02);
}
.zone:hover, .zone.over { border-color: var(--accent); background: rgba(124,111,255,.04); }
.zone.over { border-style: solid; }

.zone-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }
.zone-text { color: var(--muted); font-size: .78rem; margin-bottom: 18px; }
.zone-text b { color: var(--accent); font-weight: 400; }

.btn-pick {
  display: inline-block; background: linear-gradient(135deg, var(--accent), #9b8dff);
  color: #fff; border: none; border-radius: 9px; padding: 10px 22px;
  font-family: 'JetBrains Mono', monospace; font-size: .78rem;
  cursor: pointer; box-shadow: 0 4px 14px rgba(124,111,255,.3);
  transition: transform .15s; position: relative; z-index: 1;
}
.btn-pick:hover { transform: translateY(-1px); }

#file-input { display: none; }

.bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 12px;
}

.stitle { font-family: 'Playfair Display', serif; font-size: 1.3rem; }

.search-wrap { position: relative; }
.search-wrap input {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: .77rem;
  padding: 9px 12px 9px 30px; outline: none; width: 220px;
  transition: border-color .2s; margin-bottom: 0;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--muted); }
.si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

#list { display: flex; flex-direction: column; gap: 8px; }

.spin-wrap { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .78rem; padding: 20px 0; }
.spin {
  width: 15px; height: 15px; border: 2px solid var(--bord2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite;
}

#empty {
  display: none; flex-direction: column; align-items: center;
  padding: 60px 0; gap: 8px; color: var(--muted);
}

.card {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 13px 15px;
  transition: border-color .2s, background .2s, transform .2s;
  animation: up .2s ease;
}
.card:hover { border-color: var(--bord2); background: var(--surf2); transform: translateX(3px); }
.card.gone { opacity: 0; transform: scale(.96); transition: all .25s; }
.card.uploading { border-color: rgba(124,111,255,.3); }

.icon {
  width: 40px; height: 40px; flex-shrink: 0;
  background: var(--surf2); border: 1px solid var(--border);
  border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
}

.info { flex: 1; min-width: 0; }
.fname { font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.meta { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: .63rem; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }

.acts { display: flex; gap: 5px; flex-shrink: 0; }
.act {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: .8rem; cursor: pointer; text-decoration: none;
  transition: background .15s, color .15s, border-color .15s;
}
.act:hover { transform: translateY(-1px); }
.dl:hover  { background: rgba(111,255,212,.1); color: var(--green); border-color: var(--green); }
.sh:hover  { background: rgba(124,111,255,.1); color: var(--accent); border-color: var(--accent); }
.rm:hover  { background: rgba(255,95,109,.1); color: var(--danger); border-color: var(--danger); }

.prog-track { height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.prog-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); width: 0; transition: width .2s; }
.prog-lbl { font-size: .7rem; color: var(--accent); min-width: 32px; text-align: right; flex-shrink: 0; }

.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: var(--surf2); border: 1px solid var(--bord2);
  color: var(--text); border-radius: 10px; padding: 10px 18px;
  font-size: .77rem; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 999; white-space: nowrap; display: flex; align-items: center; gap: 7px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok  { border-color: var(--green); }
.toast.ok::before  { content: '✓'; color: var(--green); }
.toast.err { border-color: var(--danger); }
.toast.err::before { content: '✕'; color: var(--danger); }

@keyframes up   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  header { padding: 12px 16px; }
  main { padding: 24px 16px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stats .stat:last-child { display: none; }
  #user-email { display: none; }
}
</style>
</head>
<body>

<div id="auth">
  <div class="box">
    <div class="logo">FileVault</div>
    <div class="sub">Your personal cloud storage</div>
    <div class="tabs">
      <button class="tab on" id="tab-in">Sign In</button>
      <button class="tab" id="tab-up">Create Account</button>
    </div>
    <label>Email</label>
    <input type="email" id="em" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••">
    <button class="btn btn-primary" id="btn-auth">Sign In</button>
    <div class="or">or</div>
    <button class="btn btn-google" id="btn-g">
      <svg width="16" height="16" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Google
    </button>
  </div>
</div>

<div id="app">
  <header>
    <div class="hlogo">FileVault</div>
    <div class="hright">
      <span id="user-email"></span>
      <button class="btn-out" id="btn-out">Sign out</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><div class="stat-l">Files</div><div class="stat-v" id="s-count">0</div></div>
      <div class="stat"><div class="stat-l">Storage</div><div class="stat-v" id="s-size">0 <span>B</span></div></div>
      <div class="stat"><div class="stat-l">Types</div><div class="stat-v" id="s-types">—</div></div>
    </div>

    <div class="zone" id="zone">
      <span class="zone-icon">☁️</span>
      <div class="zone-text">Drop files here or <b>browse</b></div>
      <button class="btn-pick" id="btn-pick">Choose Files</button>
      <input type="file" id="file-input" multiple>
    </div>

    <div class="bar">
      <div class="stitle">Your Files</div>
      <div class="search-wrap">
        <span class="si">⌕</span>
        <input type="text" id="search" placeholder="Search…">
      </div>
    </div>

    <div id="list"></div>
    <div id="empty">
      <div style="font-size:2.5rem;opacity:.4">📭</div>
      <div style="color:var(--muted);font-size:.78rem">No files yet</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject, listAll, getMetadata } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_AUTH_DOMAIN",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId:             "YOUR_APP_ID",
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getStorage(app);
const gp   = new GoogleAuthProvider();

let mode = 'in';

const $ = id => document.getElementById(id);

function fmt(b) {
  if (b < 1024) return [b, 'B'];
  if (b < 1048576) return [(b/1024).toFixed(1), 'KB'];
  return [(b/1048576).toFixed(1), 'MB'];
}

function ext(n) { return n.includes('.') ? n.split('.').pop().toLowerCase() : '—'; }

function icon(n) {
  const e = ext(n);
  if (['png','jpg','jpeg','gif','webp','svg'].includes(e)) return '🖼';
  if (['mp4','mov','avi','mkv'].includes(e)) return '🎬';
  if (['mp3','wav','ogg','flac'].includes(e)) return '🎵';
  if (e === 'pdf') return '📄';
  if (['zip','rar','7z','tar','gz'].includes(e)) return '🗜';
  if (['doc','docx'].includes(e)) return '📝';
  if (['xls','xlsx','csv'].includes(e)) return '📊';
  if (['js','ts','py','html','css','json'].includes(e)) return '💻';
  return '📁';
}

function toast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 3000);
}

function load(btn, yes) {
  if (yes) { btn.dataset.o = btn.textContent; btn.textContent = '…'; btn.disabled = true; }
  else { btn.textContent = btn.dataset.o; btn.disabled = false; }
}

function stats(files) {
  const total = files.reduce((s, f) => s + f.size, 0);
  const types = [...new Set(files.map(f => ext(f.name)))].filter(e => e !== '—');
  $('s-count').textContent = files.length;
  const [n, u] = fmt(total);
  $('s-size').innerHTML = `${n} <span>${u}</span>`;
  $('s-types').textContent = types.length ? types.slice(0,3).join(', ') : '—';
}

async function loadFiles(user) {
  const list = $('list');
  list.innerHTML = '<div class="spin-wrap"><div class="spin"></div> Loading…</div>';
  $('empty').style.display = 'none';
  try {
    const res = await listAll(ref(db, `users/${user.uid}/`));
    list.innerHTML = '';
    if (!res.items.length) { $('empty').style.display = 'flex'; stats([]); return; }
    const items = await Promise.all(res.items.map(async item => {
      const [url, meta] = await Promise.all([getDownloadURL(item), getMetadata(item)]);
      return { item, url, meta };
    }));
    stats(items.map(({ item, meta }) => ({ name: item.name, size: meta.size })));
    items.forEach(({ item, url, meta }) => list.appendChild(makeCard(item, meta, url, user)));
  } catch (e) {
    list.innerHTML = '';
    toast(e.message, 'err');
  }
}

function makeCard(item, meta, url, user) {
  const card = document.createElement('div');
  card.className = 'card';
  const date = new Date(meta.timeCreated).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const [n, u] = fmt(meta.size);
  card.innerHTML = `
    <div class="icon">${icon(item.name)}</div>
    <div class="info">
      <div class="fname" title="${item.name}">${item.name}</div>
      <div class="meta">
        <span class="badge">${ext(item.name).toUpperCase()}</span>
        <span class="badge">${n} ${u}</span>
        <span class="badge">${date}</span>
      </div>
    </div>
    <div class="acts">
      <a class="act dl" href="${url}" target="_blank" title="Download">↓</a>
      <button class="act sh" title="Copy link">⇗</button>
      <button class="act rm" title="Delete">✕</button>
    </div>`;
  card.querySelector('.sh').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); toast('Link copied!', 'ok'); }
    catch { prompt('Copy link:', url); }
  });
  card.querySelector('.rm').addEventListener('click', async () => {
    if (!confirm(`Delete "${item.name}"?`)) return;
    try {
      await deleteObject(item);
      card.classList.add('gone');
      setTimeout(() => { card.remove(); loadFiles(user); }, 250);
      toast('Deleted', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  });
  return card;
}

function upload(files, user) {
  if (!files.length) return;
  $('empty').style.display = 'none';
  [...files].forEach(file => {
    const card = document.createElement('div');
    card.className = 'card uploading';
    card.innerHTML = `<div class="icon">⏫</div><div class="info"><div class="fname">${file.name}</div><div class="prog-track"><div class="prog-bar"></div></div></div><div class="prog-lbl">0%</div>`;
    $('list').prepend(card);
    const task = uploadBytesResumable(ref(db, `users/${user.uid}/${file.name}`), file);
    task.on('state_changed',
      s => {
        const p = Math.round(s.bytesTransferred / s.totalBytes * 100);
        card.querySelector('.prog-bar').style.width = p + '%';
        card.querySelector('.prog-lbl').textContent = p + '%';
      },
      e => { toast(e.message, 'err'); card.remove(); },
      () => { toast(`${file.name} uploaded!`, 'ok'); card.remove(); loadFiles(user); }
    );
  });
}

onAuthStateChanged(auth, user => {
  if (user) {
    $('auth').style.display = 'none';
    $('app').style.display = 'flex';
    $('user-email').textContent = user.email || user.displayName || '';
    loadFiles(user);
  } else {
    $('auth').style.display = 'flex';
    $('app').style.display = 'none';
  }
});

$('tab-in').addEventListener('click', () => {
  mode = 'in';
  $('tab-in').classList.add('on'); $('tab-up').classList.remove('on');
  $('btn-auth').textContent = 'Sign In';
});

$('tab-up').addEventListener('click', () => {
  mode = 'up';
  $('tab-up').classList.add('on'); $('tab-in').classList.remove('on');
  $('btn-auth').textContent = 'Create Account';
});

$('btn-auth').addEventListener('click', async () => {
  const btn = $('btn-auth');
  const em = $('em').value.trim(), pw = $('pw').value;
  if (!em || !pw) { toast('Enter email and password', 'err'); return; }
  load(btn, true);
  try {
    if (mode === 'in') await signInWithEmailAndPassword(auth, em, pw);
    else await createUserWithEmailAndPassword(auth, em, pw);
  } catch (e) {
    toast(e.message.replace('Firebase: ','').replace(/ \(auth\/.*?\)\.?/,''), 'err');
  } finally { load(btn, false); }
});

$('btn-g').addEventListener('click', async () => {
  try { await signInWithPopup(auth, gp); }
  catch (e) { toast(e.message.replace('Firebase: ',''), 'err'); }
});

$('btn-out').addEventListener('click', () => signOut(auth));

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-auth').click(); });

$('btn-pick').addEventListener('click', e => { e.stopPropagation(); $('file-input').click(); });
$('file-input').addEventListener('change', e => { upload(e.target.files, auth.currentUser); e.target.value = ''; });

const zone = $('zone');
zone.addEventListener('click', () => $('file-input').click());
['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('over'); }));
['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('over'); }));
zone.addEventListener('drop', e => upload(e.dataTransfer.files, auth.currentUser));

$('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.card:not(.uploading)').forEach(c => {
    c.style.display = c.querySelector('.fname')?.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});
</script>
</body>
</html>
